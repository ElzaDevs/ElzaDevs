name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *" 
  workflow_dispatch:

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

- name: Snake game generator from Github contributions
  # You may pin to the exact commit or the version.
  # uses: Sutil/snk@6a523414b8099799732942e4c95aacbc57a51cae
  uses: Sutil/snk@v01.00.02
  with:
    # github user name
    github_user_name: 
    # path of the generated gif file. If left empty, the gif file will not be generated.
    gif_out_path: # optional
    # path of the generated svg file. If left empty, the svg file will not be generated.
    svg_out_path: # optional
    # Hash color to draw the snake
    snake_color: # optional
    
